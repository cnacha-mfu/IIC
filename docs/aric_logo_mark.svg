<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="MFU-ARIC logo mark">
  <title>MFU-ARIC — AI &amp; Robotics Innovation Center</title>
  <defs>
    <linearGradient id="range" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#C8102E"/>
      <stop offset="1" stop-color="#7A0C1E"/>
    </linearGradient>
  </defs>

  <!-- sun -->
  <circle cx="418" cy="118" r="30" fill="#E4B04A"/>

  <!-- mountain range: one silhouette, two peaks -->
  <path d="M56 400 L168 192 L244 282 L320 140 L456 400 Z" fill="url(#range)"/>

  <!-- neural ridge: peaks and saddle are nodes, the network lives inside the mountain -->
  <g stroke="#F3D48A" stroke-width="5" stroke-linecap="round" fill="none">
    <path d="M168 192 L244 282 L320 140"/>
    <path d="M320 140 L300 236 L244 282"/>
    <path d="M300 236 L352 320"/>
    <path d="M244 282 L232 352 L352 320"/>
    <path d="M168 192 L232 352" opacity="0.6"/>
  </g>
  <g fill="#E4B04A">
    <circle cx="300" cy="236" r="8"/>
    <circle cx="232" cy="352" r="8"/>
    <circle cx="352" cy="320" r="8"/>
  </g>
  <g fill="#FFFFFF" stroke="#E4B04A" stroke-width="5">
    <circle cx="168" cy="192" r="12"/>
    <circle cx="244" cy="282" r="10"/>
    <circle cx="320" cy="140" r="13"/>
  </g>

  <!-- ground line -->
  <path d="M40 400 H472" stroke="#7A0C1E" stroke-width="10" stroke-linecap="round"/>
</svg>
